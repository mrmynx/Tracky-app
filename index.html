<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff0000">
<title>Tracky - Location App</title>

<!-- Manifest for PWA -->
<link rel="manifest" href="manifest.json">

<!-- Leaflet (OpenStreetMap) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
/* ================= RESET ================= */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    background: #000;
    color: #fff;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* ================= PAGE SYSTEM ================= */
.page {
    display: none;
    height: 100vh;
    width: 100%;
    position: absolute;
    top: 0; left: 0;
    flex-direction: column;
    overflow: hidden;
}
.page.active { display: flex; }

/* ================= CURVED HEADER ================= */
.top-curve {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 180px;
    background: linear-gradient(180deg, #8b0000 0%, #cc0000 40%, #ff0000 70%, transparent 100%);
    border-bottom-left-radius: 50% 40px;
    border-bottom-right-radius: 50% 40px;
    z-index: 0;
    box-shadow: 0 10px 40px rgba(255,0,0,0.4);
}

/* ================= BOTTOM NAV ================= */
.bottom-curve {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    height: 100px;
    background: linear-gradient(0deg, #8b0000 0%, #cc0000 30%, #1a0000 100%);
    border-top-left-radius: 50% 30px;
    border-top-right-radius: 50% 30px;
    z-index: 10;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 60px;
    box-shadow: 0 -10px 40px rgba(255,0,0,0.5);
}
.nav-btn {
    font-size: 32px;
    cursor: pointer;
    color: #555;
    transition: all 0.3s;
    padding: 10px;
    filter: drop-shadow(0 0 5px rgba(255,0,0,0.3));
}
.nav-btn.active {
    color: #ff0000;
    filter: drop-shadow(0 0 15px #ff0000) drop-shadow(0 0 25px #ff0000);
    transform: scale(1.15);
}

/* ================= CONTENT ================= */
.content {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 25px;
    padding-top: 110px;
    padding-bottom: 110px;
    overflow-y: auto;
}
.content::-webkit-scrollbar { display: none; }
.content { -ms-overflow-style: none; scrollbar-width: none; }

/* ================= TITLE ================= */
.page-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 30px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

/* ================= PROFILE CIRCLE ================= */
.profile-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #2a2a2a;
    border: 3px solid #ff0000;
    margin: 0 auto 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 65px;
    color: #555;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 25px rgba(255,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
}
.profile-label {
    text-align: center;
    color: #fff;
    font-size: 15px;
    letter-spacing: 1px;
    margin-bottom: 25px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
}

/* ================= INPUT BOXES ================= */
.input-box {
    width: 100%;
    padding: 18px 18px 18px 25px;
    background: rgba(10,0,0,0.9);
    border: 2px solid #ff0000;
    border-radius: 12px;
    color: #fff;
    font-size: 17px;
    margin-bottom: 18px;
    position: relative;
    box-shadow: 0 0 15px rgba(255,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.8);
    outline: none;
    transition: all 0.3s;
    min-height: 58px;
}
.input-box:focus { box-shadow: 0 0 25px rgba(255,0,0,0.6); }
.input-box::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 15%;
    height: 70%;
    width: 3px;
    background: #ff0000;
    border-radius: 2px;
}
.input-box:empty::after {
    content: attr(data-placeholder);
    color: #888;
}

/* ================= BUTTONS ================= */
.btn-red {
    width: 100%;
    padding: 18px;
    background: linear-gradient(180deg, #ff0000, #990000);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(255,0,0,0.5);
    transition: all 0.2s;
    margin-top: 15px;
    letter-spacing: 0.5px;
}
.btn-red:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(255,0,0,0.8); }

/* ================= ADD BUTTON ================= */
.add-btn {
    width: 100%;
    padding: 20px;
    background: rgba(10,0,0,0.9);
    border: 2px solid #ff0000;
    border-radius: 15px;
    color: #fff;
    font-size: 20px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.4), inset 0 0 15px rgba(0,0,0,0.8);
    margin-bottom: 15px;
}
.add-btn .plus-circle {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff0000, #660000);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 28px;
    color: #fff;
    box-shadow: 0 0 15px rgba(255,0,0,0.8);
    flex-shrink: 0;
}

/* ================= LOCATION ITEM ================= */
.location-item {
    width: 100%;
    padding: 18px;
    background: rgba(10,0,0,0.9);
    border: 2px solid #ff0000;
    border-radius: 15px;
    color: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.4), inset 0 0 15px rgba(0,0,0,0.8);
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
}
.location-item::before {
    content: '';
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 6px;
    background: #ff0000;
    box-shadow: 0 0 15px #ff0000;
}
.location-item .avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #333;
    border: 2px solid #ff0000;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    color: #777;
    flex-shrink: 0;
    margin-left: 10px;
    background-size: cover;
    background-position: center;
}
.location-item .info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}
.location-item .info .name {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
}
.location-item .info .code {
    font-size: 13px;
    color: #ff6666;
}

/* ================= PROFILE INFO ================= */
.profile-info-box {
    width: 100%;
    padding: 18px 18px 18px 25px;
    background: rgba(10,0,0,0.9);
    border: 2px solid #ff0000;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 0 15px rgba(255,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.8);
    position: relative;
}
.profile-info-box::before {
    content: '';
    position: absolute;
    left: 8px;
    top: 15%;
    height: 70%;
    width: 3px;
    background: #ff0000;
    border-radius: 2px;
}
.profile-info-box .info-label {
    color: #888;
    font-size: 13px;
    margin-bottom: 5px;
    letter-spacing: 1px;
}
.profile-info-box .info-value {
    color: #fff;
    font-size: 20px;
    font-weight: 500;
}

/* ================= MAP ================= */
#map {
    width: 100%;
    height: 100%;
    border-radius: 15px;
    border: 2px solid #ff0000;
    box-shadow: 0 0 25px rgba(255,0,0,0.5);
    z-index: 1;
}
.map-info {
    background: rgba(10,0,0,0.95);
    border: 2px solid #ff0000;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    box-shadow: 0 0 15px rgba(255,0,0,0.4);
}
.map-info p {
    font-size: 14px;
    margin: 6px 0;
    color: #ccc;
}
.map-info span { color: #ff0000; font-weight: bold; }

/* ================= MODAL ================= */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    padding: 25px;
    z-index: 1000;
}
.modal.active { display: flex; }
.modal-box {
    background: #0d0d0d;
    border: 2px solid #ff0000;
    border-radius: 18px;
    padding: 25px;
    width: 100%;
    box-shadow: 0 0 40px rgba(255,0,0,0.6);
}
.modal-box h3 {
    color: #ff0000;
    text-align: center;
    margin-bottom: 20px;
    font-size: 22px;
}

/* ================= CAMERA MODAL ================= */
#cameraModal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #000;
    flex-direction: column;
    z-index: 2000;
}
#cameraModal.active { display: flex; }
#cameraPreview {
    flex: 1;
    width: 100%;
    object-fit: cover;
}
.camera-controls {
    display: flex;
    justify-content: space-around;
    padding: 20px;
    background: #0d0d0d;
    border-top: 2px solid #ff0000;
}
.camera-controls button {
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}
.btn-capture { background: #ff0000; color: #fff; box-shadow: 0 0 20px #ff0000; }
.btn-cancel { background: #333; color: #fff; }

/* Leaflet dark */
.leaflet-container { background: #111 !important; }
</style>
</head>
<body>

<!-- ==================== PAGE 1: ADD PROFILE ==================== -->
<div id="addPage" class="page active">
    <div class="top-curve"></div>
    <div class="content">
        <div class="page-title">Add Your Profile</div>
        
        <input type="file" id="photoInput" accept="image/*" style="display: none;" onchange="showPhoto(event)">
        
        <div class="profile-circle" id="profilePicDisplay" onclick="openPhotoOptions()">+</div>
        <p class="profile-label">PROFILE</p>
        
        <div class="input-box" contenteditable="true" id="nameInput" data-placeholder="Name"></div>
        <div class="input-box" id="codeInput" contenteditable="false"></div>
        
        <button class="btn-red" onclick="saveProfile()">Add</button>
    </div>
</div>

<!-- ==================== PAGE 2: LOCATION ==================== -->
<div id="homePage" class="page">
    <div class="top-curve"></div>
    <div class="content">
        <div class="page-title">Location</div>
        
        <div id="locationList"></div>
        
        <button class="add-btn" onclick="openCodeModal()">
            <div class="plus-circle">+</div>
            <span>Add</span>
        </button>
    </div>
    <div class="bottom-curve">
        <div class="nav-btn active" id="navLoc" onclick="switchTab('location')">📍</div>
        <div class="nav-btn" id="navProf" onclick="switchTab('profile')">👤</div>
    </div>
</div>

<!-- ==================== PAGE 3: ME ==================== -->
<div id="profileViewPage" class="page">
    <div class="top-curve"></div>
    <div class="content">
        <div class="page-title" style="text-align:left; margin-left:5px;">Me</div>
        
        <div class="profile-circle" id="myProfilePic" style="cursor:default;">👤</div>
        <br>
        
        <div class="profile-info-box">
            <div class="info-label">Name</div>
            <div class="info-value" id="viewName">--</div>
        </div>
        
        <div class="profile-info-box">
            <div class="info-label">Code</div>
            <div class="info-value" id="viewCode">--</div>
        </div>
    </div>
    <div class="bottom-curve">
        <div class="nav-btn" id="navLoc2" onclick="switchTab('location')">📍</div>
        <div class="nav-btn active" id="navProf2">👤</div>
    </div>
</div>

<!-- ==================== PAGE 4: MAP ==================== -->
<div id="mapPage" class="page">
    <div class="top-curve"></div>
    <div class="content">
        <div class="page-title">World Map</div>
        <div id="map" style="flex:1; min-height:280px;"></div>
        <div class="map-info">
            <p>User: <span id="mapUserName">--</span></p>
            <p>Latitude: <span id="mapLat">--</span></p>
            <p>Longitude: <span id="mapLng">--</span></p>
            <p>District: <span id="mapDistrict">--</span></p>
            <p>State: <span id="mapState">--</span></p>
            <p>IP: <span id="mapIP">--</span></p>
            <p>Last Update: <span id="mapLastUpdate">--</span></p>
        </div>
        <button class="btn-red" onclick="goBackHome()">Back</button>
    </div>
</div>

<!-- ==================== CODE MODAL ==================== -->
<div id="codeModal" class="modal">
    <div class="modal-box">
        <h3>Enter Code</h3>
        <div class="input-box" contenteditable="true" id="searchCode" data-placeholder="Enter friend's code"></div>
        <button class="btn-red" onclick="findLocation()">Find Location</button>
        <button class="btn-red" style="background:#333; box-shadow:none; margin-top:10px;" onclick="closeCodeModal()">Cancel</button>
    </div>
</div>

<!-- ==================== CAMERA MODAL ==================== -->
<div id="cameraModal">
    <video id="cameraPreview" autoplay playsinline></video>
    <div class="camera-controls">
        <button class="btn-cancel" onclick="closeCamera()">Cancel</button>
        <button class="btn-capture" onclick="capturePhoto()">Capture</button>
    </div>
</div>

<script>
/* ================= FIREBASE INIT ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDZqURIgJ9Pq4ALDGeHaRacCzG5ID0Ugq8",
  authDomain: "tracky-deca7.firebaseapp.com",
  projectId: "tracky-deca7",
  storageBucket: "tracky-deca7.firebasestorage.app",
  messagingSenderId: "530606660731",
  appId: "1:530606660731:web:65f92f36abb8c72eb396de"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ================= GLOBAL ================= */
let map = null;
let mapMarker = null;
let stream = null;
let locationWatchId = null;

/* ================= GENERATE CODE ================= */
function generateCode() {
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const numbers = "0123456789";
    let code = "";
    for (let i = 0; i < 3; i++) code += letters.charAt(Math.floor(Math.random() * letters.length));
    for (let i = 0; i < 4; i++) code += numbers.charAt(Math.floor(Math.random() * numbers.length));
    return code;
}

/* ================= PLACEHOLDER ================= */
document.querySelectorAll('[contenteditable="true"]').forEach(el => {
    el.addEventListener('focus', function() {
        if (this.innerText.trim() === this.dataset.placeholder) this.innerText = '';
    });
    el.addEventListener('blur', function() {
        if (this.innerText.trim() === '') this.innerText = this.dataset.placeholder;
    });
    if (!el.innerText) el.innerText = el.dataset.placeholder;
});

/* ================= PHOTO ================= */
function openPhotoOptions() {
    const choice = confirm("Use Camera?\n\nOK = Camera\nCancel = Gallery");
    if (choice) openCamera();
    else document.getElementById("photoInput").click();
}

async function openCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        document.getElementById("cameraPreview").srcObject = stream;
        document.getElementById("cameraModal").classList.add("active");
    } catch (err) {
        alert("Could not open camera. Please use gallery.");
        document.getElementById("photoInput").click();
    }
}

function closeCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById("cameraModal").classList.remove("active");
}

function capturePhoto() {
    const video = document.getElementById("cameraPreview");
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const photoData = canvas.toDataURL("image/jpeg");
    localStorage.setItem("myPhoto", photoData);
    setProfileImage(photoData);
    closeCamera();
}

function showPhoto(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            localStorage.setItem("myPhoto", e.target.result);
            setProfileImage(e.target.result);
        };
        reader.readAsDataURL(file);
    }
}

function setProfileImage(data) {
    const img = document.getElementById("profilePicDisplay");
    img.style.backgroundImage = `url(${data})`;
    img.innerHTML = "";
}

/* ================= SAVE PROFILE ================= */
async function saveProfile() {
    const nameEl = document.getElementById("nameInput");
    let name = nameEl.innerText.trim();
    if (name === nameEl.dataset.placeholder) name = "";
    const code = document.getElementById("codeInput").innerText.trim();
    const photo = localStorage.getItem("myPhoto") || "";
    
    if (name === "") { alert("Please enter a name"); return; }
    
    localStorage.setItem("myName", name);
    localStorage.setItem("myCode", code);
    
    try {
        await db.collection("users").doc(code).set({
            name: name,
            code: code,
            photo: photo,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });
        console.log("Profile saved to Firebase");
    } catch(e) {
        console.log("Firebase error:", e);
    }
    
    alert("Profile saved successfully!\n\nYour Code: " + code);
    
    showPage("homePage");
    loadProfile();
    startLocationTracking();
}

/* ================= LOAD PROFILE ================= */
function loadProfile() {
    const name = localStorage.getItem("myName");
    const code = localStorage.getItem("myCode");
    const photo = localStorage.getItem("myPhoto");
    if (name) document.getElementById("viewName").innerText = name;
    if (code) document.getElementById("viewCode").innerText = code;
    if (photo) {
        const img = document.getElementById("myProfilePic");
        img.style.backgroundImage = `url(${photo})`;
        img.innerHTML = "";
    }
}

/* ================= NAVIGATION ================= */
function showPage(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function switchTab(tab) {
    if (tab === 'location') {
        showPage("homePage");
        document.getElementById("navLoc").classList.add("active");
        document.getElementById("navProf").classList.remove("active");
        document.getElementById("navLoc2").classList.add("active");
        document.getElementById("navProf2").classList.remove("active");
    } else {
        showPage("profileViewPage");
        document.getElementById("navProf2").classList.add("active");
        document.getElementById("navLoc2").classList.remove("active");
        document.getElementById("navProf").classList.add("active");
        document.getElementById("navLoc").classList.remove("active");
        loadProfile();
    }
}

function goBackHome() {
    showPage("homePage");
    document.getElementById("navLoc").classList.add("active");
    document.getElementById("navProf").classList.remove("active");
}

/* ================= CODE MODAL ================= */
function openCodeModal() { document.getElementById("codeModal").classList.add("active"); }
function closeCodeModal() {
    document.getElementById("codeModal").classList.remove("active");
    const sc = document.getElementById("searchCode");
    sc.innerText = sc.dataset.placeholder;
}

/* ================= FIND LOCATION (Firebase) ================= */
async function findLocation() {
    const scEl = document.getElementById("searchCode");
    let searchCode = scEl.innerText.trim();
    if (searchCode === scEl.dataset.placeholder) searchCode = "";
    searchCode = searchCode.toUpperCase();
    const myCode = localStorage.getItem("myCode");
    
    if (searchCode === "") { alert("Please enter a code"); return; }
    if (searchCode === myCode) { alert("This is your own code!"); return; }
    
    closeCodeModal();
    
    try {
        const doc = await db.collection("users").doc(searchCode).get();
        if (doc.exists) {
            const data = doc.data();
            if (!data.lat || !data.lng) {
                alert("This user's location is not available yet. Make sure their app is open.");
                return;
            }
            const lat = data.lat;
            const lng = data.lng;
            const name = data.name || searchCode;
            
            document.getElementById("mapUserName").innerText = name + " (" + searchCode + ")";
            document.getElementById("mapLat").innerText = lat.toFixed(4);
            document.getElementById("mapLng").innerText = lng.toFixed(4);
            
            if (data.lastUpdate && data.lastUpdate.toDate) {
                const d = data.lastUpdate.toDate();
                document.getElementById("mapLastUpdate").innerText = d.toLocaleString();
            } else {
                document.getElementById("mapLastUpdate").innerText = "Unknown";
            }
            
            saveUserToList(searchCode, name, data.photo || "");
            
            showPage("mapPage");
            setTimeout(() => { initMapWithLocation(lat, lng); }, 400);
            getLocationDetails(lat, lng);
        } else {
            alert("Code not found! Make sure your friend has installed the app.");
        }
    } catch(e) {
        alert("Error: " + e.message);
    }
}

/* ================= USER LIST (LocalStorage) ================= */
function saveUserToList(code, name, photo) {
    let list = JSON.parse(localStorage.getItem("savedUsers") || "[]");
    if (!list.find(u => u.code === code)) {
        list.push({ code: code, name: name, photo: photo });
        localStorage.setItem("savedUsers", JSON.stringify(list));
    }
    renderUserList();
}

function renderUserList() {
    const list = JSON.parse(localStorage.getItem("savedUsers") || "[]");
    const container = document.getElementById("locationList");
    container.innerHTML = "";
    
    if (list.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "text-align:center; color:#666; padding:30px 0; font-size:14px;";
        empty.innerText = "No users added yet. Tap + Add to start.";
        container.appendChild(empty);
        return;
    }
    
    list.forEach(user => {
        const div = document.createElement("div");
        div.className = "location-item";
        div.onclick = () => {
            document.getElementById("searchCode").innerText = user.code;
            findLocation();
        };
        
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        if (user.photo) {
            avatar.style.backgroundImage = `url(${user.photo})`;
        } else {
            avatar.innerText = "👤";
        }
        
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = `<div class="name">${user.name || user.code}</div><div class="code">${user.code}</div>`;
        
        div.appendChild(avatar);
        div.appendChild(info);
        container.appendChild(div);
    });
}

/* ================= LEAFLET MAP ================= */
function initMap() {
    const mapContainer = document.getElementById('map');
    if (!mapContainer) return;
    if (map) { map.remove(); map = null; }
    map = L.map('map').setView([9.9312, 76.2673], 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);
}

function initMapWithLocation(lat, lng) {
    if (!map) { initMap(); setTimeout(() => initMapWithLocation(lat, lng), 300); return; }
    map.setView([lat, lng], 15);
    if (mapMarker) map.removeLayer(mapMarker);
    mapMarker = L.marker([lat, lng]).addTo(map);
}

/* ================= NOMINATIM (District, State, IP) ================= */
async function getLocationDetails(lat, lng) {
    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10&addressdetails=1`);
        const data = await res.json();
        const addr = data.address || {};
        const district = addr.state_district || addr.county || addr.city || "Unknown";
        const state = addr.state || "Unknown";
        document.getElementById("mapDistrict").innerText = district;
        document.getElementById("mapState").innerText = state;
    } catch(e) {
        document.getElementById("mapDistrict").innerText = "Unknown";
        document.getElementById("mapState").innerText = "Unknown";
    }
    
    try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipRes.json();
        document.getElementById("mapIP").innerText = ipData.ip;
    } catch(e) {
        document.getElementById("mapIP").innerText = "Unknown";
    }
}

/* ================= GPS TRACKING (Sends to Firebase) ================= */
function startLocationTracking() {
    const myCode = localStorage.getItem("myCode");
    const myName = localStorage.getItem("myName");
    const myPhoto = localStorage.getItem("myPhoto") || "";
    
    if (!myCode) return;
    if (!navigator.geolocation) {
        alert("GPS is not available on this device");
        return;
    }
    
    if (locationWatchId) navigator.geolocation.clearWatch(locationWatchId);
    
    locationWatchId = navigator.geolocation.watchPosition(
        async (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            
            localStorage.setItem("myLat", lat);
            localStorage.setItem("myLng", lng);
            
            try {
                await db.collection("users").doc(myCode).set({
                    name: myName,
                    code: myCode,
                    photo: myPhoto,
                    lat: lat,
                    lng: lng,
                    lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
                console.log("Location sent:", lat, lng);
            } catch(e) {
                console.log("Firebase error:", e);
            }
        },
        (err) => console.log("GPS Error:", err),
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 10000 }
    );
}

/* ================= INIT ================= */
window.onload = function() {
    const name = localStorage.getItem("myName");
    const code = localStorage.getItem("myCode");
    
    if (name && code) {
        showPage("homePage");
        loadProfile();
        renderUserList();
        startLocationTracking();
        setTimeout(initMap, 500);
    } else {
        showPage("addPage");
        document.getElementById("codeInput").innerText = generateCode();
        const nameEl = document.getElementById("nameInput");
        if (!nameEl.innerText) nameEl.innerText = nameEl.dataset.placeholder;
    }
};
